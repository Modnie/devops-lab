---
- name: Download Zabbix repository package
  ansible.builtin.get_url:
    url: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb
    dest: /tmp/zabbix-release.deb
    mode: '0644'

- name: Install Zabbix repository
  ansible.builtin.apt:
    deb: /tmp/zabbix-release.deb

- name: Install Zabbix components
  ansible.builtin.apt:
    name:
      - zabbix-server-pgsql
      - zabbix-frontend-php
      - php8.3-pgsql
      - zabbix-nginx-conf
      - zabbix-sql-scripts
      - zabbix-agent2
    state: present
    update_cache: true

- name: Check if Zabbix database schema is already imported
  community.postgresql.postgresql_query:
    db: zabbix
    query: "SELECT to_regclass('public.users') AS users_table;"
  become: true
  become_user: postgres
  register: zabbix_schema_check

- name: Import initial Zabbix database schema
  ansible.builtin.shell:
    cmd: >
      zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz |
      psql zabbix
  become: true
  become_user: zabbix
  when: zabbix_schema_check.query_result[0].users_table is none

- name: Configure Zabbix database name
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#? ?DBName='
    line: 'DBName=zabbix'
  notify: Restart Zabbix Server

- name: Configure Zabbix database user
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#? ?DBUser='
    line: 'DBUser=zabbix'
  notify: Restart Zabbix Server

- name: Configure Zabbix database password
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#? ?DBPassword='
    line: 'DBPassword={{ vault_zabbix_db_password }}'
  no_log: true
  notify: Restart Zabbix Server

- name: Configure Zabbix frontend listen port
  ansible.builtin.lineinfile:
    path: /etc/zabbix/nginx.conf
    regexp: '^\s*#?\s*listen\s+'
    line: '        listen 80;'
  notify: Restart nginx

- name: Configure Zabbix frontend server name
  ansible.builtin.lineinfile:
    path: /etc/zabbix/nginx.conf
    regexp: '^\s*#?\s*server_name\s+'
    line: '        server_name _;'
  notify: Restart nginx

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Enable and start Zabbix Server
  ansible.builtin.systemd_service:
    name: zabbix-server
    state: started
    enabled: true

- name: Enable and start Zabbix Agent 2
  ansible.builtin.systemd_service:
    name: zabbix-agent2
    state: started
    enabled: true

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true

- name: Enable and start PHP-FPM
  ansible.builtin.systemd_service:
    name: php8.3-fpm
    state: started
    enabled: true
