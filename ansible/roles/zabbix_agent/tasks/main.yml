---
- name: Download Zabbix repository package
  ansible.builtin.get_url:
    url: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb
    dest: /tmp/zabbix-release.deb
    mode: '0644'

- name: Install Zabbix repository
  ansible.builtin.apt:
    deb: /tmp/zabbix-release.deb

- name: Install Zabbix Agent 2
  ansible.builtin.apt:
    name: zabbix-agent2
    state: present
    update_cache: true

- name: Configure Zabbix server for passive checks
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: '^Server='
    line: 'Server={{ zabbix_server_ip }}'
  notify: Restart Zabbix Agent 2

- name: Configure Zabbix server for active checks
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: '^ServerActive='
    line: 'ServerActive={{ zabbix_server_ip }}'
  notify: Restart Zabbix Agent 2

- name: Configure Zabbix Agent hostname
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: '^Hostname='
    line: 'Hostname={{ inventory_hostname }}'
  notify: Restart Zabbix Agent 2

- name: Enable and start Zabbix Agent 2
  ansible.builtin.systemd_service:
    name: zabbix-agent2
    state: started
    enabled: true
